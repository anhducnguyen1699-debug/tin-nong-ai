# Danh sách nguồn tin. Kiểm tra nguồn nào còn sống bằng:
#   python -m pipeline.collect --check
# Nguồn chết thì đặt enabled: false hoặc xóa đi.

rss:
  # --- Thời sự & kinh tế thế giới ---
  - {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", lang: en}
  - {name: BBC Business, url: "https://feeds.bbci.co.uk/news/business/rss.xml", lang: en}
