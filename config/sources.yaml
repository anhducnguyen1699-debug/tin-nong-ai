  - {name: STAT Health Tech, url: "https://www.statnews.com/category/health-tech/feed/", lang: en}

# Google News: tìm theo từ khóa trong 1 ngày gần nhất. Miễn phí, bù cho phần tìm web bằng AI.
google_news:
  - {query: "AI healthcare", lang: en}
  - {query: "AI diagnosis FDA", lang: en}
  - {query: "trí tuệ nhân tạo y tế", lang: vi}
