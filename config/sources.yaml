  - {query: "South China Sea", lang: en}
  - {query: "giá vàng", lang: vi}
  - {query: "tỷ giá USD", lang: vi}
  - {query: "VN-Index", lang: vi}

hacker_news:
  enabled: true
  min_points: 150

