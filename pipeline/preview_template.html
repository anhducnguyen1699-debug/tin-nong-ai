<title>Bản tin nóng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Bố cục: một cột đọc trên điện thoại; mỗi sự kiện là một thẻ, nút phản hồi ở cuối thẻ. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #142033; --muted: #5b6678; --line: #dfe4ec;
  --accent: #0b6e8a; --accent-soft: #e2f1f6;
  --ai: #2f55c9; --ai-soft: #e7edfc; --world: #a2560b; --world-soft: #fbeedd;
  --good: #1f7a4d; --good-soft: #e3f3ea; --bad: #b3362d; --bad-soft: #fbe6e4;
  --font-display: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #161d28; --ink: #e6ebf2; --muted: #98a3b4; --line: #273142;
  --accent: #5cc3df; --accent-soft: #15303b;
  --ai: #8ea9ff; --ai-soft: #1c2747; --world: #f0a858; --world-soft: #352612;
  --good: #5fd39a; --good-soft: #13321f; --bad: #ff8a80; --bad-soft: #3a1a18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #161d28; --ink: #e6ebf2; --muted: #98a3b4; --line: #273142;
  --accent: #5cc3df; --accent-soft: #15303b;
  --ai: #8ea9ff; --ai-soft: #1c2747; --world: #f0a858; --world-soft: #352612;
  --good: #5fd39a; --good-soft: #13321f; --bad: #ff8a80; --bad-soft: #3a1a18; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
h1 { font: 700 1.6rem/1.2 var(--font-display); margin: 0; text-wrap: balance; }
h2 { font: 600 1.12rem/1.35 var(--font-display); margin: 0; text-wrap: balance; }
.head { display: grid; gap: 6px; }
.meta { color: var(--muted); font-size: .88rem; }
.stale { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
.status { font-size: .82rem; color: var(--muted); }
.status.warn { color: var(--bad); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: 500 .86rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card.skipped { opacity: .6; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .8rem; }
.chip { font-weight: 600; padding: 2px 8px; border-radius: 6px; letter-spacing: .02em; }
.chip.ai_cong_nghe { background: var(--ai-soft); color: var(--ai); }
.chip.thoi_su_kinh_te { background: var(--world-soft); color: var(--world); }
.score { font: 500 .95rem var(--font-data); font-variant-numeric: tabular-nums; }
.parts { font: 500 .74rem var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.goals { color: var(--muted); }
ul.points { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
sup a { color: var(--accent); text-decoration: none; font: 500 .7rem var(--font-data); margin-left: 2px; }
.label { font-weight: 600; }
.why, .todo { margin: 0; }
.disc { font-size: .8rem; color: var(--muted); font-style: italic; margin: 0; }
.reason { margin: 0; color: var(--muted); font-size: .9rem; }
details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
details.src ol { margin: 6px 0 0; padding-left: 20px; font-size: .86rem; display: grid; gap: 4px; }
details.src a { color: var(--accent); overflow-wrap: anywhere; }
.actions { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.actions .spacer { flex: 1; }
.btn { font: 500 .84rem var(--font-body); border: 1px solid var(--line); background: transparent; color: var(--ink);
  padding: 5px 11px; border-radius: 8px; cursor: pointer; }
.btn[aria-pressed="true"].yes { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.btn[aria-pressed="true"].no { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn[aria-pressed="true"].mid { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
details.more { width: 100%; }
details.more > div { display: grid; gap: 8px; padding-top: 8px; }
.q { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .86rem; }
.q > span { min-width: 88px; color: var(--muted); }
.note { width: 100%; font: .86rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; box-sizing: border-box; }
.saved-msg { font-size: .78rem; color: var(--muted); }
details.article { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
details.article > summary { padding: 10px 12px; color: var(--accent); font: 600 .9rem var(--font-body); list-style-position: inside; }
details.article[open] > summary { border-bottom: 1px solid var(--line); }
.art { padding: 4px 14px 14px; display: grid; gap: 10px; }
.art .sapo { font-weight: 500; margin: 8px 0 0; }
.art h3 { font: 600 1rem/1.35 var(--font-display); margin: 8px 0 0; }
.art p, .art ul { margin: 0; }
.art ul { padding-left: 18px; display: grid; gap: 4px; }
.art .cite { color: var(--accent); text-decoration: none; font: 500 .72rem var(--font-data); vertical-align: super; margin-left: 1px; }
.art ol.srcs { margin: 0; padding-left: 20px; font-size: .84rem; display: grid; gap: 6px; }
.art ol.srcs a { color: var(--accent); overflow-wrap: anywhere; }
.art .tag { font: 500 .7rem var(--font-data); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.empty { color: var(--muted); text-align: center; padding: 32px 0; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="wrap">
  <header class="head">
    <h1>Bản tin nóng</h1>
    <div class="meta" id="meta"></div>
    <div class="meta" id="byline"></div>
    <div class="status" id="status">Đang nối kho phản hồi…</div>
  </header>
  <div class="stale" id="stale" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Lọc tin"></nav>
  <main class="list" id="list"></main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const CAT = { ai_cong_nghe: "AI & công nghệ", thoi_su_kinh_te: "Thời sự & kinh tế" };
  const GOAL = { dau_tu: "Đầu tư", nghe_y: "Thu nhập nghề y nhờ AI", dia_chinh_tri: "Địa chính trị & kinh tế" };
  const FILTERS = [["all", "Tất cả"], ["ai_cong_nghe", "AI & công nghệ"], ["thoi_su_kinh_te", "Thời sự & kinh tế"],
                   ["saved", "Đã lưu"], ["todo", "Chưa phản hồi"]];
  const STALE_HOURS = 30;  // chạy mỗi sáng: quá 30 giờ chưa có lượt mới là có vấn đề
  const ratings = {};      // key -> phản hồi đã lưu (kèm ảnh chụp sự kiện)
  const chains = {};       // key -> chuỗi ghi tuần tự cho từng phiếu
  let db = null, filter = "all";

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
    }
    kids.flat(Infinity).forEach((c) => c != null && n.append(c));
    return n;
  };
  const fmt = (iso, opts) => { try { return new Date(iso).toLocaleString("vi-VN", opts); } catch { return iso; } };

  function setStatus(text, warn) { const s = $("status"); s.textContent = text; s.classList.toggle("warn", !!warn); }

  function renderHead() {
    const day = fmt(DATA.generated_at, { weekday: "long", day: "2-digit", month: "2-digit" });
    const time = fmt(DATA.generated_at, { hour: "2-digit", minute: "2-digit" });
    $("meta").textContent = `Bản tin ${day}, cập nhật ${time} · ${DATA.events.length} sự kiện · ` +
      `${DATA.events.filter((e) => e.card).length} thẻ đầy đủ`;
    $("byline").textContent = DATA.byline || "";
    const age = (Date.now() - new Date(DATA.generated_at).getTime()) / 3.6e6;
    const stale = $("stale");
    stale.hidden = !(age > STALE_HOURS);
    stale.textContent = `Bản tin đã cũ: lượt gần nhất chạy cách đây ${Math.round(age)} giờ. Lượt sáng nay có thể đã lỗi.`;
  }

  function renderTabs() {
    $("tabs").replaceChildren(...FILTERS.map(([k, label]) => {
      const n = k === "saved" ? savedEvents().length : null;
      const b = el("button", { type: "button", "aria-pressed": String(filter === k), text: n ? `${label} (${n})` : label });
      b.addEventListener("click", () => { filter = k; renderTabs(); renderList(); });
      return b;
    }));
  }

  // Tin đã lưu: tin hôm nay có đánh dấu Lưu, cộng tin lưu từ các ngày trước (dựng lại từ ảnh chụp trong phiếu)
  function savedEvents() {
    const today = new Map(DATA.events.map((e) => [e.key, e]));
    return Object.entries(ratings).filter(([, r]) => r.saved).map(([key, r]) => today.get(key) || {
      key, id: r.event_id, category: r.event?.category, score: r.event?.score, importance: r.event?.importance,
      impact: r.event?.impact, hotness: r.event?.hotness, source_count: r.event?.source_count,
      title: r.event?.title_vi || r.event?.title || "(không rõ tiêu đề)", card: r.event?.card || null,
      article: r.event?.article || null,
      reason: "", summary: r.event?.summary || "", articles: r.event?.articles || [], fromEarlier: r.run_at,
    });
  }

  function toggle(e, field, value, label, tone) {
    const r = ratings[e.key] || {};
    const b = el("button", { type: "button", class: "btn " + tone, "aria-pressed": String(r[field] === value), text: label });
    if (!db) b.disabled = true;
    b.addEventListener("click", () => {
      const cur = ratings[e.key] || {};
      setRating(e, { ...cur, [field]: cur[field] === value ? null : value });
    });
    return b;
  }

  function feedback(e) {
    const r = ratings[e.key] || {};
    const more = el("details", { class: "more" }, el("summary", { text: "Chấm kỹ hơn" }),
      el("div", {},
        el("div", { class: "q" }, el("span", { text: `Điểm ${e.score}/10` }),
          toggle(e, "score_judgement", "dung", "Đúng", "yes"), toggle(e, "score_judgement", "cao", "Cao quá", "no"),
          toggle(e, "score_judgement", "thap", "Thấp quá", "mid")),
        e.card ? el("div", { class: "q" }, el("span", { text: "Nên làm gì" }),
          toggle(e, "action_ok", "co", "Dùng được", "yes"), toggle(e, "action_ok", "khong", "Sáo rỗng", "no")) : null,
        (() => {
          const note = el("input", { class: "note", id: "note-" + e.key, type: "text", maxlength: "300",
                                     placeholder: "Ghi chú cho AI (không bắt buộc)" });
          note.value = r.note || "";
          if (!db) note.disabled = true;
          note.addEventListener("change", () => setRating(e, { ...(ratings[e.key] || {}), note: note.value.trim() }));
          return note;
        })()));
    return el("div", { class: "actions" },
      toggle(e, "worth", "dang_doc", "Hữu ích", "yes"), toggle(e, "worth", "khong", "Bỏ qua", "no"),
      el("span", { class: "spacer" }), toggle(e, "saved", true, r.saved ? "Đã lưu" : "Lưu", "mid"),
      el("span", { class: "saved-msg", id: "msg-" + e.key }), more);
  }

  // [n] trong câu thành đường dẫn tới nguồn số n
  // **chữ đậm** thành <strong>; [n] thành đường dẫn tới nguồn số n. Dựng bằng phần tử DOM, không chèn HTML thô.
  function withCites(line, sources) {
    const byId = new Map((sources || []).map((s) => [s.id, s]));
    const out = [];
    let last = 0;
    for (const m of line.matchAll(/\*\*([^*]+)\*\*|\[(\d+)\]/g)) {
      out.push(line.slice(last, m.index));
      if (m[1] !== undefined) {
        out.push(el("strong", {}, withCites(m[1], sources)));
      } else {
        const s = byId.get(Number(m[2]));
        out.push(s ? el("a", { class: "cite", href: s.url, target: "_blank", rel: "noopener", title: s.name, text: `[${m[2]}]` }) : m[0]);
      }
      last = m.index + m[0].length;
    }
    out.push(line.slice(last));
    return out;
  }

  // Thân bài: đoạn văn cách nhau dòng trống, các dòng bắt đầu bằng "- " thành danh sách
  function richText(text, sources) {
    return text.split(/\n\s*\n/).map((block) => {
      const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
      if (lines.length && lines.every((l) => l.startsWith("- "))) {
        return el("ul", {}, lines.map((l) => el("li", {}, withCites(l.slice(2), sources))));
      }
      return el("p", {}, withCites(lines.join(" "), sources));
    });
  }

  function articleBox(a) {
    return el("details", { class: "article" },
      el("summary", { text: `Đọc bài phân tích (${a.words} từ · ${a.sources.length} nguồn)` }),
      el("div", { class: "art" },
        el("p", { class: "sapo" }, withCites(a.sapo, a.sources)),
        a.sections.map((s) => [el("h3", { text: s.heading }), richText(s.body, a.sources)]),
        el("h3", { text: "Nguồn" }),
        el("ol", { class: "srcs" }, a.sources.map((s) => el("li", { value: String(s.id) },
          el("a", { href: s.url, target: "_blank", rel: "noopener", text: s.name }),
          el("span", { class: "tag", text: s.kind === "goc" ? "nguồn gốc" : "báo" }),
          el("span", { class: "tag", text: s.full ? "đọc toàn văn" : "chỉ tiêu đề" }),
          s.note ? ` ${s.note}` : null)))));
  }

  function card(e) {
    const c = e.card;
    const node = el("article", { class: "card" + (ratings[e.key]?.worth === "khong" ? " skipped" : ""), id: "card-" + e.key },
      el("div", { class: "top" },
        el("span", { class: "chip " + e.category, text: CAT[e.category] || e.category || "" }),
        e.score != null ? el("span", { class: "score", text: `${e.score}/10` }) : null,
        e.importance != null ? el("span", { class: "parts", text: `quan trọng ${e.importance} · ảnh hưởng ${e.impact} · độ nóng ${e.hotness}` }) : null,
        e.fromEarlier ? el("span", { class: "goals", text: "lưu từ " + fmt(e.fromEarlier, { day: "2-digit", month: "2-digit" }) }) : null,
        e.source_count ? el("span", { class: "goals", text: `${e.source_count} nguồn` }) : null));
    if (c) {
      node.append(el("h2", { text: c.title_vi }));
      node.append(el("ul", { class: "points" }, c.key_points.map((kp) => {
        const src = (c.sources || []).find((s) => s.id === kp.source_id);
        return el("li", {}, kp.text, src ? el("sup", {}, el("a", { href: src.url, target: "_blank", rel: "noopener", title: src.name, text: `[${src.id}]` })) : null);
      })));
      node.append(el("p", { class: "why" }, el("span", { class: "label", text: "Vì sao quan trọng với bạn: " }), c.why_it_matters));
      node.append(el("p", { class: "todo" }, el("span", { class: "label", text: "Nên làm gì: " }), c.what_to_do));
      if (c.affected_goals?.length) node.append(el("div", { class: "goals", text: "Ảnh hưởng: " + c.affected_goals.map((g) => GOAL[g] || g).join(", ") }));
      if (c.disclaimer) node.append(el("p", { class: "disc", text: c.disclaimer }));
      if (e.article) node.append(articleBox(e.article));
    } else if (e.article) {
      node.append(el("h2", { text: e.article.title }));
      node.append(articleBox(e.article));
    } else {
      node.append(el("h2", { text: e.title }));
      if (e.reason) node.append(el("p", { class: "reason", text: "AI chấm: " + e.reason }));
    }
    if (e.articles?.length) {
      node.append(el("details", { class: "src" }, el("summary", { text: `Nguồn (${e.articles.length} bài)` }),
        el("ol", {}, e.articles.map((a) => el("li", {}, el("a", { href: a.url, target: "_blank", rel: "noopener", text: a.title }), ` — ${a.source}`)))));
    }
    node.append(feedback(e));
    return node;
  }

  function renderList() {
    const active = document.activeElement;
    const typing = active && active.classList.contains("note") ? { id: active.id, value: active.value } : null;
    const openMore = [...document.querySelectorAll("details.more[open]")].map((d) => d.closest(".card")?.id);
    const items = filter === "saved" ? savedEvents()
      : DATA.events.filter((e) => filter === "all" ? true : filter === "todo" ? !ratings[e.key]?.worth : e.category === filter);
    const empty = filter === "saved" ? "Chưa lưu tin nào. Bấm Lưu ở cuối thẻ để đọc lại sau." : "Không còn tin nào trong mục này.";
    $("list").replaceChildren(...(items.length ? items.map(card) : [el("p", { class: "empty", text: empty })]));
    openMore.forEach((id) => { const d = id && document.querySelector(`#${CSS.escape(id)} details.more`); if (d) d.open = true; });
    if (typing) { const n = $(typing.id); if (n) { n.value = typing.value; n.focus(); } }
  }

  function setRating(e, next) {
    ratings[e.key] = { ...ratings[e.key], ...next };
    const msg = $("msg-" + e.key);
    if (msg) msg.textContent = "Đang lưu…";
    const r = ratings[e.key];
    const body = {
      key: e.key, event_id: e.id, run_at: r.run_at || DATA.generated_at,
      worth: r.worth || null, score_judgement: r.score_judgement || null, action_ok: r.action_ok || null,
      note: r.note || "", saved: !!r.saved,
      // Ảnh chụp sự kiện: để dựng bộ đề chuẩn và hiện lại tin đã lưu sau khi bản tin đổi ngày
      event: r.event || { title: e.title, title_vi: e.card?.title_vi || null, category: e.category, score: e.score,
               importance: e.importance, impact: e.impact, hotness: e.hotness, source_count: e.source_count,
               summary: e.summary || "", articles: (e.articles || []).slice(0, 4), card: e.card || null,
               article: e.article || null },
      rated_at: new Date().toISOString(),
    };
    ratings[e.key].event = body.event;
    ratings[e.key].run_at = body.run_at;
    chains[e.key] = (chains[e.key] || Promise.resolve())
      .then(() => db.doc("ratings/" + e.key).set(body))
      .then(() => { const m = $("msg-" + e.key); if (m) m.textContent = "Đã lưu"; },
            (err) => { const m = $("msg-" + e.key); if (m) m.textContent = "Chưa lưu được (" + (err?.code || "lỗi") + "), bấm lại sau."; });
    renderTabs();
    renderList();
  }

  renderHead();
  renderTabs();
  renderList();

  (async () => {
    try { db = await window.claude?.use?.("db"); } catch { db = null; }
    if (!db) {
      setStatus("Chế độ xem này không lưu được phản hồi. Hãy mở trang trên claude.ai khi đã đăng nhập.", true);
      return;
    }
    setStatus("Đang tải phản hồi đã lưu…");
    const timer = setTimeout(() => setStatus("Chưa tải được phản hồi cũ. Bạn vẫn bấm được, phản hồi sẽ lưu khi kết nối lại.", true), 10000);
    db.collection("ratings").onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus("Bấm Hữu ích hoặc Bỏ qua để bản tin sau chấm sát ý bạn hơn. Bấm là tự lưu."); }
      snap.docs.forEach((d) => {
        if (chains[d.id]) return;  // phiếu đang ghi dở ở trang này thì giữ bản trên trang
        const v = d.data();
        ratings[d.id] = { worth: v.worth, score_judgement: v.score_judgement, action_ok: v.action_ok, note: v.note,
                          saved: v.saved, event: v.event, event_id: v.event_id, run_at: v.run_at };
      });
      renderTabs();
      renderList();
    }, (err) => { clearTimeout(timer); setStatus("Mất kết nối kho phản hồi (" + err.code + "). Tải lại trang để thử lại.", true); });
  })();
})();
</script>
